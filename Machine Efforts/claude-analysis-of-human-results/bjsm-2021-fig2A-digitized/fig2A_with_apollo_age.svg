<g id="attribution"><text x="92" y="552" font-size="12.5" fill="#444" font-weight="600">Every curve on one age axis. Olympian and population curves are shifted by the mean age at first Games: men +25 yr (SD 4.87), women +21 (SD</text><text x="92" y="571" font-size="12.5" fill="#444" font-weight="600">4.41)</text><text x="92" y="590" font-size="12.5" fill="#444">(Antero et al., Front Physiol 2021;12:705616, Table 2, Games 1912-1972 - the BJSM paper itself reports no baseline age).</text><text x="92" y="609" font-size="12.5" fill="#444">Two caveats that do not cancel. (1) Entry ages are a distribution, not a point: shifting by the mean translates each curve without reshaping</text><text x="92" y="628" font-size="12.5" fill="#444">it,</text><text x="92" y="647" font-size="12.5" fill="#444">so the true age-scale curve is slightly flatter than the one drawn here. (2) The Olympian curves start at survival = 1 at entry; the Apollo</text><text x="92" y="666" font-size="12.5" fill="#444">curve</text><text x="92" y="685" font-size="12.5" fill="#444">starts at survival = 1 at age 30 and is therefore conditional on survival to 30 - which costs nothing, since all 29 were alive then.</text><text x="92" y="704" font-size="12.5" fill="#444">Redrawn from digitized values of Figure 2A in Antero et al., Br J Sports Med 2021;55:206-212; digitization accuracy ±1 px (≈±0.3 % survival,</text><text x="92" y="723" font-size="12.5" fill="#444">±0.2 yr).</text><text x="92" y="742" font-size="12.5" fill="#444">Source figure © Author(s) (or their employer(s)) 2020, published by BMJ; &quot;No commercial re-use.&quot; No raster from the original is reproduced</text><text x="92" y="761" font-size="12.5" fill="#444">here.</text></g>
