<g id="attribution"><text x="92" y="552" font-size="12.5" fill="#444" font-weight="600">Supplementary Figure S1C is the authors' OWN age-30 analysis - &quot;Cumulative probability of death conditional to the age of first Olympic</text><text x="92" y="571" font-size="12.5" fill="#444" font-weight="600">participation ... C) From age 30 onwards&quot; - so no baseline shift and no rescaling are needed on either side. It is the cleanest published</text><text x="92" y="590" font-size="12.5" fill="#444" font-weight="600">comparator for an Apollo curve that starts at 30.</text><text x="92" y="609" font-size="12.5" fill="#444">Its cohort is narrower than Figure 2C's: athletes who had ALREADY been to a Games by age 30, a restriction on entry age, not merely on</text><text x="92" y="628" font-size="12.5" fill="#444">survival. The panel is also small - 228 x 287 px for the whole plot, so 1 px = 0.38 yr and 0.0038 probability units, roughly three times</text><text x="92" y="647" font-size="12.5" fill="#444">coarser than Figure 2A. Area between the two curves, ages 43-90: 5.73 yr (paper's whole-cohort years-saved 5.1, 95% CI 4.3-6.0).</text><text x="92" y="666" font-size="12.5" fill="#444">Redrawn from digitized values of Supplementary material 1, page 3, Figure S1 panel C, Antero et al., Br J Sports Med 2021;55:206-212. Source</text><text x="92" y="685" font-size="12.5" fill="#444">figure © Author(s) (or their employer(s)) 2020, published by BMJ; &quot;No commercial re-use.&quot; No raster from the original is reproduced here.</text></g>
