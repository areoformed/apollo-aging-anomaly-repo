<g id="attribution"><text x="92" y="552" font-size="12.5" fill="#444" font-weight="600">Panel B is already on an age axis, so no baseline shift is needed. p3 is the era-matched cohort: Olympians who competed 1948-1964,</text><text x="92" y="571" font-size="12.5" fill="#444" font-weight="600">against Apollo astronauts born 1923-1937 and selected 1959-1966.</text><text x="92" y="590" font-size="12.5" fill="#444">The Olympian curves are rescaled to S(age)/S(30) so that both sides start from 'alive at 30', which is where Apollo's curve begins.</text><text x="92" y="609" font-size="12.5" fill="#444">For p3 the divisor is S(30) = 94.4 % - the drop is the 1961 air crash that killed the US figure-skating team,</text><text x="92" y="628" font-size="12.5" fill="#444">flagged in the paper's supplementary file; conditioning on age 30 removes it. The published, unconditioned p3 is drawn faintly for comparison.</text><text x="92" y="647" font-size="12.5" fill="#444">Two confounds, both stated rather than corrected: p3 pools both sexes while Apollo is all male (women outlived men by ~9 yr of median</text><text x="92" y="666" font-size="12.5" fill="#444">follow-up</text><text x="92" y="685" font-size="12.5" fill="#444">in panel A, so this biases p3 upward, against Apollo); and panel B's curves carry CI bands that overlap heavily above age 60 - p3 was resolved</text><text x="92" y="704" font-size="12.5" fill="#444">in</text><text x="92" y="723" font-size="12.5" fill="#444">73 % of pixel columns, p2 in 65 %, p4 in 53 %, with gaps interpolated. Redrawn from digitized values of Figure 2B; Source figure © Author(s)</text><text x="92" y="742" font-size="12.5" fill="#444">(or their employer(s)) 2020, published by BMJ; &quot;No commercial re-use.&quot; No raster from the original is reproduced here.</text></g>
</svg>