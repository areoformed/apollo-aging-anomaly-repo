<g id="attribution"><text x="92" y="552" font-size="12.5" fill="#444" font-weight="600">Brown dashed: SSA 1930 male birth-cohort table (Actuarial Study 120, TR2024 Alt2), the table smr.c uses, as 1 - l(age)/l(30).</text><text x="92" y="571" font-size="12.5" fill="#444" font-weight="600">It is a COHORT table for one birth year; the paper's black referent is a PERIOD table matched to each Olympian's sex and calendar year. Built</text><text x="92" y="590" font-size="12.5" fill="#444" font-weight="600">differently,</text><text x="92" y="609" font-size="12.5" fill="#444" font-weight="600">they nonetheless agree: over ages 30-88 the mean gap is 0.013 in probability, the largest 0.062 (at 69, a digitization step), mean signed</text><text x="92" y="628" font-size="12.5" fill="#444" font-weight="600">difference 0.001.</text><text x="92" y="647" font-size="12.5" fill="#444" font-weight="600">Figure 2C digitized as a stacked area: teal fill = Olympians, black curve on top of the grey wedge = the US general population.</text><text x="92" y="666" font-size="12.5" fill="#444">Solid lines are rescaled to start from age 30, F(age|30) = (F(age) - F(30)) / (1 - F(30)), so they begin where Apollo's curve begins;</text><text x="92" y="685" font-size="12.5" fill="#444">the published curves, which run from cohort entry, are drawn faintly behind them.</text><text x="92" y="704" font-size="12.5" fill="#444">Independent check on this digitization: the area between the two published curves from age 25 to 90 comes to 5.28 years, against the</text><text x="92" y="723" font-size="12.5" fill="#444">paper's headline years-saved of 5.1 (95% CI 4.3 to 6.0). The paper computes that per individual, so agreement this close is corroboration,</text><text x="92" y="742" font-size="12.5" fill="#444">not reproduction. Redrawn from digitized values of Figure 2C in Antero et al., Br J Sports Med 2021;55:206-212. Source figure © Author(s) (or</text><text x="92" y="761" font-size="12.5" fill="#444">their employer(s)) 2020, published by BMJ; &quot;No commercial re-use.&quot; No raster from the original is reproduced here.</text></g>
</svg>